<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueSmart - Login</title>
  <link rel="stylesheet" href="style/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <h1>QueueSmart</h1>
  <p class="subtitle">Sistema Inteligente de Fila para Pequenos Negócios</p>

  <form action="#" method="POST">

    <h2>Login</h2>

    <label class="campo-label" for="email">E-mail</label>
    <input class="campo-input" type="email" placeholder="seu@email.com" required  />

    <label class="campo-label" for="senha">Senha</label>
    <input class="campo-input" type="password" placeholder="Digite sua senha" required />

    <div class="lembrar">
      <input class="campo-checkbox" type="checkbox" />
      <label class="campo-label">Manter conectado</label>
    </div>

    <button class="btn-entrar" type="submit">Entrar</button>

    <p class="rodape-form">Não tem conta? <a class="link" href="cadastro.html">Cadastre-se</a></p>
    <a class="link" href="recuperar.html">Esqueceu sua senha?</a>

  </form>

</body>
</html>
