<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueueSmart - Cadastro</title>
  <link rel="stylesheet" href="style/cadastro.css" />
</head>
<body>

  <h1>QueueSmart</h1>
  <p class="subtitle">Sistema Inteligente de Fila para Pequenos Negócios</p>

  <form action="#" method="POST">

    <h2>Cadastre-se</h2>

    <label class="campo-label">Nome</label>
    <input class="campo-input" type="name" placeholder="Digite Seu Nome" required />

    <label class="campo-label">E-mail</label>
    <input class="campo-input" type="email" placeholder="Digite Seu Email" required />

    <label class="campo-label">Senha</label>
    <input class="campo-input" type="password" placeholder="Digite sua senha" required />

    <label class="campo-label">Confirme sua Senha</label>
    <input class="campo-input" type="password" placeholder="Digite sua senha" required />


    <button class="btn-entrar" type="submit">Cadastrar</button>

    <p class="rodape-form">Já possui uma conta? <a class="link" href="login.html">Entrar</a></p>

  </form>

</body>
</html>
